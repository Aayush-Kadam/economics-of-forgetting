[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economics-of-forgetting"
version = "0.1.0"
description = "Minimal models of reputation memory, deterrence, and productive rehabilitation"
authors = [{name = "Aayush Kadam"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "reportlab>=4.0", "pypdf>=5.0", "pypdfium2>=4.30"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
